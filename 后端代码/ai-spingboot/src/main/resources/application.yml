# 数据源配置：连接本地 mental_health_assistant 数据库
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=UTC
    username: root
    # 本地开发默认值，生产环境请通过环境变量 MYSQL_PASSWORD 覆盖
    password: ${MYSQL_PASSWORD:123456}

  # Spring AI 配置：使用 OpenAI 兼容协议接入 DeepSeek
  ai:
    openai:
      chat:
        options:
          # 对话模型名称
          model: deepseek-chat
          # 允许模型使用工具调用能力
          tool-calling:
            enabled: true
        # DeepSeek 兼容 OpenAI 的补全接口路径
        completions-path: /v1/chat/completions
      # API Key：从环境变量 DEEPSEEK_API_KEY 读取，避免明文密钥进入代码仓库
      # 未配置环境变量时应用会启动失败（fail-fast），避免使用空 key 调用接口
      # PowerShell 设置示例：$env:DEEPSEEK_API_KEY="sk-xxx"
      # IDEA 运行配置：Run -> Edit Configurations -> Environment variables 中添加 DEEPSEEK_API_KEY
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
# 服务器配置
server:
  port: 1236

# JWT 配置
jwt:
  # HMAC256 签名密钥：从环境变量 JWT_SECRET 读取，避免明文密钥进入代码仓库
  # 未配置时应用启动失败（fail-fast），避免使用默认弱密钥签发 token
  # PowerShell 设置示例：$env:JWT_SECRET="<一段足够长的随机字符串>"
  secret: ${JWT_SECRET}
  expiration: 86400000  # 访问 token 有效期：24 小时（毫秒）
  refresh-expiration: 604800000  # 刷新 token 有效期：7 天（毫秒，暂未使用）
  header: Authorization  # token 请求头名称（当前过滤器实际读取 token 头）
  token-prefix: "Bearer "  # token 前缀（当前业务暂未使用）

